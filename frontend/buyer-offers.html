<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View and manage your submitted agricultural purchase offers and their status.">
  <title>My Submitted Offers — FarmerLinkage</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-layout">
  <div id="dashboard-sidebar-container"></div>

  <div class="dashboard-main">
    <div id="dashboard-header-container"></div>

    <main class="dashboard-content">
      <div id="buyer-offers-container">
        <div class="loading-container">
          <div class="spinner spinner-lg"></div>
          <span>Retrieving your submitted purchase offers...</span>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/buyer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.requireAuth(['BUYER'])) {
        Buyer.loadBuyerOffers();
      }
    });
  </script>
</body>
</html>
