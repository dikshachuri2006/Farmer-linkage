<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detailed agricultural produce listing specifications and verified buyer offer submission.">
  <title>Produce Lot Details — FarmerLinkage</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/public.css">
  <link rel="stylesheet" href="css/marketplace.css">
</head>
<body>
  <!-- Strict Public Navbar -->
  <div id="public-navbar"></div>

  <main class="section">
    <div class="container">
      <div style="margin-bottom: var(--spacing-6);">
        <a href="marketplace.html" style="display:inline-flex; align-items:center; gap:var(--spacing-1); font-size:var(--font-size-sm); font-weight:600;">
          &larr; Back to Marketplace
        </a>
      </div>

      <div id="listing-details-container">
        <div class="loading-container">
          <div class="spinner spinner-lg"></div>
          <span>Loading produce lot details...</span>
        </div>
      </div>
    </div>
  </main>

  <!-- BUYER OFFER MODAL -->
  <div class="modal-overlay" id="offer-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title">Submit Purchase Offer</h3>
        <button class="modal-close" onclick="Utils.closeModal('offer-modal')">&times;</button>
      </div>
      <form id="buyer-offer-form" novalidate>
        <div class="modal-body">
          <input type="hidden" id="offer-lot-id">

          <div class="form-group">
            <label for="offer-qty" class="form-label">Requested Quantity <span class="required">*</span></label>
            <input type="number" id="offer-qty" class="form-control" min="1" step="any" required>
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="offer-rate" class="form-label">Offered Price per Unit (₹) <span class="required">*</span></label>
            <input type="number" id="offer-rate" class="form-control" min="1" step="0.01" required>
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label style="display:flex; align-items:center; gap:var(--spacing-2); cursor:pointer;">
              <input type="checkbox" id="offer-pickup" style="width:18px; height:18px;">
              <span style="font-size:var(--font-size-sm); font-weight:600;">Buyer will pick up directly from farmgate</span>
            </label>
          </div>

          <div class="form-group" id="delivery-loc-group">
            <label for="offer-delivery-loc" class="form-label">Delivery Destination <span class="required">*</span></label>
            <input type="text" id="offer-delivery-loc" class="form-control" placeholder="e.g. Vashi APMC Warehouse #4, Navi Mumbai">
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="offer-notes" class="form-label">Terms / Notes (Optional)</label>
            <textarea id="offer-notes" class="form-control" rows="2" placeholder="e.g. 50% advance upon loading, balance upon digital receipt confirmation."></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="Utils.closeModal('offer-modal')">Cancel</button>
          <button type="submit" id="submit-offer-btn" class="btn btn-primary">Submit Binding Offer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Strict Public Footer -->
  <div id="public-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/marketplace.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Navigation.renderPublicNavbar();
      Navigation.renderPublicFooter();
      Marketplace.initListingDetails();
    });
  </script>
</body>
</html>
