<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Platform Administration Console — FarmerLinkage.">
  <title>System Administration — FarmerLinkage</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-layout">
  <div id="dashboard-sidebar-container"></div>

  <div class="dashboard-main">
    <div id="dashboard-header-container"></div>

    <main class="dashboard-content">
      <div style="margin-bottom:var(--spacing-6);">
        <h2 style="font-size:var(--font-size-xl); margin-bottom:var(--spacing-1);">Platform Administration Overview</h2>
        <p style="font-size:var(--font-size-sm); color:var(--color-secondary-text); margin-bottom:0;">
          Monitor ecosystem participants, approve commercial buyer verifications, manage APMC mandis, and audit digital transactions.
        </p>
      </div>

      <!-- METRIC CARDS -->
      <div id="admin-stats-grid" class="stats-grid">
        <div class="loading-container" style="grid-column: 1 / -1;">
          <div class="spinner"></div>
          <span>Loading system metrics...</span>
        </div>
      </div>

      <!-- PENDING VERIFICATIONS PREVIEW -->
      <div class="card">
        <div class="card-header">
          <h3 style="font-size:var(--font-size-base);">Pending Commercial Buyer Verifications</h3>
          <a href="admin-verification.html" class="btn btn-sm btn-outline">Review All</a>
        </div>
        <div class="card-body" id="admin-pending-verifications" style="padding:0;">
          <div class="loading-container">
            <div class="spinner"></div>
            <span>Loading verification requests...</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.requireAuth(['ADMIN'])) {
        Admin.loadDashboard();
      }
    });
  </script>
</body>
</html>
