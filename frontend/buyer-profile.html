<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your commercial buyer profile and verification status on FarmerLinkage.">
  <title>Buyer Profile & Verification — FarmerLinkage</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-layout">
  <div id="dashboard-sidebar-container"></div>

  <div class="dashboard-main">
    <div id="dashboard-header-container"></div>

    <main class="dashboard-content">
      <div class="container-narrow" style="margin: 0 auto;">
        <div class="card" style="margin-bottom: var(--spacing-6);">
          <div class="card-header">
            <div>
              <h2 style="font-size:var(--font-size-lg); margin-bottom:2px;">Commercial Entity Profile</h2>
              <p style="font-size:var(--font-size-xs); color:var(--color-secondary-text); margin-bottom:0;">
                Verified commercial buyers enjoy priority matching and can submit purchase offers directly on producer lots.
              </p>
            </div>
            <div style="display:flex; align-items:center; gap:var(--spacing-2);">
              <span style="font-size:var(--font-size-xs); color:var(--color-secondary-text);">Status:</span>
              <span id="buyer-verification-chip"><span class="badge badge-neutral">Checking...</span></span>
            </div>
          </div>

          <div class="card-body">
            <div id="buyer-profile-alert" class="alert alert-error" style="display:none;"></div>
            <div id="buyer-profile-success" class="alert alert-success" style="display:none;"></div>

            <form id="buyer-profile-form" novalidate>
              <div class="form-group">
                <label for="buyer-bus-name" class="form-label">Business / Firm Name <span class="required">*</span></label>
                <input type="text" id="buyer-bus-name" class="form-control" placeholder="e.g. Sahyadri Agro Traders Pvt Ltd" required>
                <div class="form-error"></div>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div class="form-group">
                  <label for="buyer-bus-type" class="form-label">Business Entity Type <span class="required">*</span></label>
                  <select id="buyer-bus-type" class="form-select" required>
                    <option value="WHOLESALER">Wholesale Merchant / Commission Agent</option>
                    <option value="PROCESSOR">Food Processor / Mill</option>
                    <option value="RETAILER">Supermarket / Retail Chain</option>
                    <option value="EXPORTER">Export Trading House</option>
                    <option value="OTHER">Other Commercial Buyer</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="buyer-license" class="form-label">Trade / APMC License or GSTIN <span class="required">*</span></label>
                  <input type="text" id="buyer-license" class="form-control" placeholder="e.g. MH-APMC-98721 or 27AAAAA0000A1Z5" required>
                  <div class="form-error"></div>
                </div>
              </div>

              <div class="form-group">
                <label for="buyer-address" class="form-label">Commercial / Market Office Address <span class="required">*</span></label>
                <textarea id="buyer-address" class="form-control" rows="2" placeholder="e.g. Shop #42, Grain Market APMC Yard, Vashi, Navi Mumbai, Maharashtra" required></textarea>
                <div class="form-error"></div>
              </div>

              <div style="display:flex; justify-content:space-between; align-items:center; margin-top:var(--spacing-6);">
                <button type="button" class="btn btn-outline" onclick="Utils.openModal('verification-modal')">
                  🛡️ Request Verification
                </button>
                <button type="submit" id="btn-save-buyer-profile" class="btn btn-primary">
                  Save Profile Details
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- VERIFICATION REQUEST MODAL -->
  <div class="modal-overlay" id="verification-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title">Submit Official Buyer Verification</h3>
        <button class="modal-close" onclick="Utils.closeModal('verification-modal')">&times;</button>
      </div>
      <form id="buyer-verif-form" novalidate>
        <div class="modal-body">
          <p style="font-size:var(--font-size-xs); color:var(--color-secondary-text); margin-bottom:var(--spacing-4);">
            Our platform administrators review commercial credentials to ensure secure and trustworthy trading.
          </p>

          <div class="form-group">
            <label for="verif-name" class="form-label">Registered Business Name <span class="required">*</span></label>
            <input type="text" id="verif-name" class="form-control" placeholder="Legal registered trade name" required>
            <div class="form-error"></div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
              <label for="verif-type" class="form-label">Business Type <span class="required">*</span></label>
              <select id="verif-type" class="form-select">
                <option value="WHOLESALER">Wholesaler</option>
                <option value="PROCESSOR">Food Processor</option>
                <option value="RETAILER">Retail Chain</option>
                <option value="EXPORTER">Exporter</option>
              </select>
            </div>

            <div class="form-group">
              <label for="verif-license" class="form-label">APMC License / GSTIN <span class="required">*</span></label>
              <input type="text" id="verif-license" class="form-control" placeholder="License / Registration number" required>
              <div class="form-error"></div>
            </div>
          </div>

          <div class="form-group">
            <label for="verif-address" class="form-label">Market Yard / Warehouse Address <span class="required">*</span></label>
            <input type="text" id="verif-address" class="form-control" placeholder="Physical location of mandi premises" required>
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="verif-notes" class="form-label">Verification Notes (Optional)</label>
            <textarea id="verif-notes" class="form-control" rows="2" placeholder="Relevant APMC registration details or references..."></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="Utils.closeModal('verification-modal')">Cancel</button>
          <button type="submit" id="btn-submit-verification" class="btn btn-primary">Submit Verification Request</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/buyer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.requireAuth(['BUYER'])) {
        Buyer.loadProfile();
      }
    });
  </script>
</body>
</html>
